<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Manager</title>
    <style>
      /* Hallmark · redesign: operations workbench · hierarchy-first data surface
       * direction: restrained instrument panel, no decorative claims
       * contrast: dark + light reviewed against semantic tokens */
      :root {
        --bg: #0b0e12;
        --bg-raised: #10151b;
        --surface: #131920;
        --surface-hover: #19212a;
        --surface-selected: #202a35;
        --ink: #e8edf2;
        --ink-muted: #9ba7b5;
        --ink-faint: #6e7c8c;
        --ink3: #6e7c8c;
        --line: #29333e;
        --line-strong: #3b4856;
        --accent: #e8b44a;
        --accent-ink: #1b1406;
        --good: #4fcf8b;
        --warn: #e8b44a;
        --bad: #e26d5a;
        --info: #78b5ee;
        --genome-fill: #bdc9d5;
        --genome-empty: #1a222c;
        --mutation: #e26d5a;
        --mutation-glow: rgba(226, 109, 90, 0.22);
        --variant: #e8b44a;
        --variant-glow: rgba(232, 180, 74, 0.2);
        --shadow: 0 20px 48px rgba(0, 0, 0, 0.2);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      [data-theme="light"] {
        --bg: #f4f5f6;
        --bg-raised: #eef0f2;
        --surface: #ffffff;
        --surface-hover: #f7f8f9;
        --surface-selected: #eceff2;
        --ink: #18212b;
        --ink-muted: #4d5d6e;
        --ink-faint: #718094;
        --ink3: #718094;
        --line: #d9dee4;
        --line-strong: #bbc5ce;
        --accent: #a87514;
        --accent-ink: #fffdf7;
        --good: #19805a;
        --warn: #9c6c10;
        --bad: #bf4d3e;
        --info: #2d70af;
        --genome-fill: #4e6172;
        --genome-empty: #e6eaee;
        --mutation: #c65445;
        --mutation-glow: rgba(198, 84, 69, 0.16);
        --variant: #a87514;
        --variant-glow: rgba(168, 117, 20, 0.15);
        --shadow: 0 16px 36px rgba(35, 44, 53, 0.1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-width: 0;
        overflow-x: clip;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px 28px 64px;
      }
      .head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 18px;
        min-height: 72px;
        padding: 0 0 19px;
        border-bottom: 1px solid var(--line-strong);
      }
      .head h1 {
        font: 700 clamp(19px, 2.2vw, 25px)/1 var(--mono);
        letter-spacing: -0.055em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .head .st {
        min-width: 0;
        color: var(--ink-faint);
        font: 10px/1.3 var(--mono);
        letter-spacing: 0.055em;
      }
      .head .sp {
        display: none;
      }
      .head button,
      .chip,
      .sync-confirm {
        min-height: 33px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: transparent;
        color: var(--ink-muted);
        cursor: pointer;
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.055em;
        text-transform: uppercase;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease;
        white-space: nowrap;
      }
      .head button {
        padding: 0 10px;
      }
      .head button:first-of-type {
        border-color: var(--accent);
        color: var(--accent);
      }
      .head button:hover,
      .chip:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 6%, transparent);
      }
      .head button:active,
      .chip:active,
      .sync-confirm:active {
        transform: translateY(1px);
      }
      .head button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        margin: 24px 0 18px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stat {
        min-width: 0;
        padding: 13px 15px 14px;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border-right: 0;
      }
      .stat .n {
        font: 650 22px/1 var(--mono);
        letter-spacing: -0.05em;
      }
      .stat .l {
        margin-top: 6px;
        color: var(--ink-faint);
        font: 9px/1.1 var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .stat .n.good {
        color: var(--good);
      }
      .stat .n.warn {
        color: var(--warn);
      }
      .stat .n.bad {
        color: var(--bad);
      }
      .health {
        margin: 0 0 22px;
        border-top: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line);
        background: var(--bg-raised);
      }
      .health-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 2px 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .health-head h2,
      .portability h3 {
        color: var(--ink-muted);
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .health-head h2::before {
        content: "01";
        margin-right: 10px;
        color: var(--accent);
      }
      .health-head span {
        color: var(--ink-faint);
        font: 10px/1 var(--mono);
      }
      .health-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 11px 14px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .health-item:last-child {
        border-bottom: 0;
      }
      .health-item:hover {
        background: var(--surface-hover);
      }
      .health-item strong {
        display: block;
        font: 650 11.5px/1.3 var(--mono);
      }
      .health-item small {
        display: block;
        margin-top: 2px;
        color: var(--ink-muted);
        font-size: 11px;
      }
      .health-empty {
        padding: 12px 14px;
        color: var(--good);
        font: 11px var(--mono);
      }
      .controls {
        display: grid;
        grid-template-columns: auto minmax(180px, 1fr) auto auto;
        align-items: center;
        gap: 11px;
        margin: 0 0 14px;
      }
      .controls input {
        width: 100%;
        min-width: 0;
        padding: 9px 11px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font: 12px/1.2 var(--mono);
        outline: none;
      }
      .controls input::placeholder {
        color: var(--ink-faint);
      }
      .controls input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 0 9px;
        color: var(--ink-faint);
      }
      .chip.on {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      .view-toggle {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg-raised);
      }
      .view-toggle button {
        min-height: 28px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--ink-faint);
        cursor: pointer;
        font: 700 9px/1 var(--mono);
        letter-spacing: 0.06em;
        padding: 0 8px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .view-toggle button[aria-pressed="true"] {
        background: var(--surface-selected);
        color: var(--ink);
      }
      .view-toggle button:hover {
        color: var(--accent);
      }
      .genome-wall,
      .rows,
      .body-results,
      .matrix,
      .portability {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .genome-wall::before {
        content: "Genome wall  ·  five-location deployment signature";
        display: block;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-faint);
        background: var(--bg-raised);
        font: 9px/1 var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .genome-row {
        display: grid;
        grid-template-columns: minmax(190px, 1.35fr) minmax(180px, 1fr) 62px;
        align-items: center;
        gap: 28px;
        width: 100%;
        min-height: 67px;
        padding: 13px 15px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: background 130ms ease;
      }
      .genome-row:last-child {
        border-bottom: 0;
      }
      .genome-row:hover {
        background: var(--surface-hover);
      }
      .genome-row:focus-visible {
        outline-offset: -3px;
      }
      .genome-name {
        min-width: 0;
      }
      .genome-name strong {
        display: block;
        overflow: hidden;
        font: 650 12px/1.3 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .genome-name small {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--ink-faint);
        font-size: 10.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .genome-track {
        position: relative;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        width: min(100%, 194px);
        height: 16px;
        padding: 2px 0;
      }
      .gene {
        position: relative;
        min-width: 0;
        border-radius: 2px;
        background: var(--genome-empty);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .gene.present {
        background: var(--genome-fill);
        box-shadow: none;
      }
      .gene.mutated {
        transform: translateY(2px);
        background: linear-gradient(
          112deg,
          var(--mutation) 0 43%,
          var(--bg) 44% 50%,
          var(--mutation) 51% 100%
        );
        box-shadow:
          0 0 0 1px var(--mutation),
          0 0 12px var(--mutation-glow);
      }
      .gene.variant {
        transform: translateY(1px);
        background: repeating-linear-gradient(
          90deg,
          var(--variant) 0 4px,
          color-mix(in srgb, var(--variant) 42%, var(--genome-empty)) 4px 7px
        );
        box-shadow:
          0 0 0 1px var(--variant),
          0 0 11px var(--variant-glow);
      }
      .gene.variant::before {
        content: "v";
        position: absolute;
        inset: -2px 0 auto;
        color: var(--accent-ink);
        font: 700 8px/1 var(--mono);
        text-align: center;
      }
      .gene::after {
        position: absolute;
        top: 23px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--ink-faint);
        content: attr(data-location);
        font: 7px/1 var(--mono);
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .genome-signal {
        justify-self: end;
        color: var(--good);
        font: 800 9px/1 var(--mono);
        letter-spacing: 0.08em;
      }
      .genome-signal.drift {
        color: var(--mutation);
      }
      .genome-signal.duplicate {
        color: var(--warn);
      }
      .genome-signal.variant {
        color: var(--variant);
      }
      .genome-up {
        display: inline-flex;
        align-items: center;
        margin-left: 7px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink-faint);
        font: 700 8px/1 var(--mono);
        letter-spacing: 0.04em;
        vertical-align: 1px;
      }
      .genome-up.ok {
        border-color: color-mix(in srgb, var(--good) 50%, var(--line));
        color: var(--good);
      }
      .genome-up.stale {
        border-color: var(--mutation);
        color: var(--mutation);
      }
      .genome-up.unknown {
        opacity: 0.6;
      }
      .genome-track.pulse::before {
        position: absolute;
        z-index: 0;
        inset: -10px -12px;
        border: 1px solid var(--mutation);
        border-radius: 6px;
        content: "";
        opacity: 0;
        pointer-events: none;
        animation: genome-ripple 900ms ease-out both;
      }
      @keyframes genome-ripple {
        0% {
          opacity: 0;
          transform: scaleX(0.86);
        }
        25% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: scaleX(1.1);
        }
      }
      .matrix {
        width: 100%;
        border-collapse: collapse;
        font: 11px/1.4 var(--mono);
      }
      .matrix caption {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-faint);
        background: var(--bg-raised);
        font: 9px/1 var(--mono);
        letter-spacing: 0.09em;
        text-align: left;
        text-transform: uppercase;
      }
      .matrix th {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-faint);
        background: var(--bg-raised);
        font: 700 9px/1 var(--mono);
        letter-spacing: 0.08em;
        text-align: left;
        text-transform: uppercase;
      }
      .matrix td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .matrix tbody tr:last-child td {
        border-bottom: 0;
      }
      .matrix tbody tr {
        cursor: pointer;
        transition: background 130ms ease;
      }
      .matrix tbody tr:hover {
        background: var(--surface-hover);
      }
      .matrix .m-name {
        overflow: hidden;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .matrix .m-name small {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--ink-faint);
        font-size: 9.5px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .matrix .m-cell,
      .portability-cell {
        color: var(--ink-faint);
        font-size: 11px;
        text-align: center;
      }
      .matrix .m-cell.present {
        color: var(--genome-fill);
      }
      .matrix .m-cell.mutated {
        color: var(--mutation);
        text-shadow: 0 0 8px var(--mutation-glow);
      }
      .matrix .m-cell.variant {
        color: var(--variant);
        text-shadow: 0 0 8px var(--variant-glow);
      }
      .matrix .m-signal {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }
      .matrix .m-signal.drift {
        color: var(--mutation);
      }
      .matrix .m-signal.duplicate,
      .matrix .m-signal.variant {
        color: var(--warn);
      }
      .portability-cell {
        min-width: 68px;
        cursor: help;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .portability-cell.ok {
        color: var(--good);
      }
      .portability-cell.warn {
        color: var(--warn);
      }
      .portability-cell.incompatible {
        color: var(--mutation);
      }
      .rows {
        background: var(--surface);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(150px, 0.62fr) minmax(
            180px,
            1.4fr
          ) auto auto auto;
        gap: 16px;
        align-items: center;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        transition: background 130ms ease;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--surface-hover);
      }
      .row .nm {
        overflow: hidden;
        font: 650 12px/1.25 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .ds {
        overflow: hidden;
        color: var(--ink-muted);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .harnesses {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .har {
        border: 1px solid var(--line-strong);
        border-radius: 3px;
        padding: 2px 5px;
        color: var(--ink-faint);
        font: 700 8px/1 var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .har.on {
        border-color: color-mix(in srgb, var(--info) 60%, var(--line));
        color: var(--info);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        border-radius: 999px;
        padding: 0 8px;
        font: 800 8.5px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .b-good {
        border: 1px solid color-mix(in srgb, var(--good) 65%, var(--line));
        color: var(--good);
      }
      .b-warn {
        border: 1px solid color-mix(in srgb, var(--warn) 65%, var(--line));
        color: var(--warn);
      }
      .b-bad {
        border: 1px solid color-mix(in srgb, var(--bad) 65%, var(--line));
        color: var(--bad);
      }
      .empty {
        padding: 44px 20px;
        color: var(--ink-faint);
        font: 11px/1.5 var(--mono);
        text-align: center;
      }
      .body-results {
        margin: -4px 0 14px;
        background: var(--surface);
      }
      .body-results .br-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 13px;
        border-bottom: 1px solid var(--line);
        background: var(--bg-raised);
        color: var(--ink-faint);
        font: 700 9px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .body-results .br-item {
        display: block;
        width: 100%;
        padding: 10px 13px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }
      .body-results .br-item:last-child {
        border-bottom: 0;
      }
      .body-results .br-item:hover {
        background: var(--surface-hover);
      }
      .body-results .br-item strong {
        font: 650 11px var(--mono);
      }
      .body-results .br-item em {
        color: var(--accent);
        font-style: normal;
      }
      .body-results .br-item small {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: var(--ink-faint);
        font: 10px/1.45 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #drawer {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        background: rgba(5, 7, 10, 0.58);
        backdrop-filter: blur(4px);
      }
      #drawer.open {
        display: block;
      }
      #drawer .panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(660px, 94vw);
        background: var(--bg-raised);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }
      #drawer .ph {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 72px;
        padding: 17px 18px;
        border-bottom: 1px solid var(--line-strong);
      }
      #drawer .ph h2 {
        min-width: 0;
        overflow: hidden;
        font: 700 16px/1.2 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #dProvenance {
        display: none;
      }
      #dProvenance:not(:empty) {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--ink-muted);
        font: 700 8px/1 var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      #dProvenance.upstream {
        border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
        color: var(--accent);
      }
      #drawer .ph .x {
        width: 32px;
        height: 32px;
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        color: var(--ink-muted);
        cursor: pointer;
        font-size: 19px;
      }
      #drawer .ph .x:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #drawer .pbody {
        flex: 1;
        overflow-y: auto;
        padding: 20px 18px 32px;
      }
      .meta {
        margin: 0 0 10px;
        color: var(--ink-muted);
        font-size: 11.5px;
      }
      .meta b {
        color: var(--ink);
      }
      .copies,
      .portability,
      pre.skilltext {
        margin: 0 0 20px;
      }
      .copies .c {
        display: grid;
        grid-template-columns: 82px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 11px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-muted);
        font: 10.5px/1.25 var(--mono);
      }
      .copies .c:last-child {
        border-bottom: 0;
      }
      .copies .c .sha {
        color: var(--ink-faint);
        font-size: 9px;
      }
      .portability {
        border-radius: 7px;
      }
      .portability h3 {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .portability-agent {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
      }
      .portability-agent:last-child {
        border-bottom: 0;
      }
      .portability-agent strong {
        display: inline-block;
        min-width: 82px;
        font: 700 10px var(--mono);
        text-transform: uppercase;
      }
      .portability-agent .status {
        font: 800 9px var(--mono);
        letter-spacing: 0.06em;
      }
      .portability-agent .status.ok {
        color: var(--good);
      }
      .portability-agent .status.warn {
        color: var(--warn);
      }
      .portability-agent .status.incompatible {
        color: var(--mutation);
      }
      .portability-issue {
        margin: 7px 0 0 82px;
        color: var(--ink-muted);
        font-size: 10.5px;
      }
      .portability-issue code {
        color: var(--ink);
        font: 10px var(--mono);
      }
      .portability-issue small {
        color: var(--ink-faint);
      }
      pre.skilltext {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink-muted);
        font: 10.5px/1.6 var(--mono);
        white-space: pre-wrap;
        max-height: 400px;
        overflow-y: auto;
      }
      .sync-preview {
        margin-top: 18px;
        padding: 13px;
        border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--line));
        border-radius: 7px;
        background: color-mix(in srgb, var(--accent) 4%, var(--surface));
      }
      .sync-preview h3 {
        margin-bottom: 6px;
        font: 700 11px var(--mono);
      }
      .sync-preview p {
        margin-bottom: 11px;
        color: var(--ink-muted);
        font-size: 11px;
      }
      .sync-target {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 9px 0;
        border-top: 1px solid var(--line);
        color: var(--ink-muted);
        cursor: pointer;
      }
      .sync-target input {
        margin-top: 2px;
        accent-color: var(--accent);
      }
      .sync-target strong {
        display: block;
        color: var(--ink);
        font: 650 10px var(--mono);
      }
      .sync-target small {
        display: block;
        margin-top: 2px;
        color: var(--ink-faint);
        font-size: 10px;
      }
      .sync-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .sync-confirm {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        padding: 0 10px;
      }
      .sync-confirm:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .sync-note {
        margin-top: 10px;
        color: var(--ink-faint);
        font-size: 10px;
      }
      #toast {
        position: fixed;
        z-index: 200;
        bottom: 22px;
        left: 50%;
        max-width: min(92vw, 520px);
        transform: translate(-50%, 10px);
        padding: 9px 13px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--ink);
        color: var(--bg);
        font: 10px/1.35 var(--mono);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      footer {
        margin-top: 18px;
        color: var(--ink-faint);
        font: 9.5px/1.4 var(--mono);
        letter-spacing: 0.04em;
      }
      /* app-mode shell: two-column workspace with an accessible mode rail */
      .workspace-shell {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .mode-rail {
        position: sticky;
        top: 18px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg-raised);
      }
      .mode-rail button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--ink-faint);
        cursor: pointer;
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-align: left;
        text-transform: uppercase;
        white-space: nowrap;
        transition:
          background 140ms ease,
          color 140ms ease;
      }
      .mode-rail button:hover {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 6%, transparent);
      }
      .mode-rail button[aria-pressed="true"] {
        background: var(--surface-selected);
        color: var(--ink);
      }
      .attention-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--line);
        color: var(--ink-muted);
        font: 800 9px/1 var(--mono);
      }
      .attention-count.has {
        background: var(--mutation);
        color: var(--bg);
      }
      /* attention mode isolates the mutation queue and hides the workbench */
      .wrap[data-app-mode="attention"] .stats,
      .wrap[data-app-mode="attention"] .controls,
      .wrap[data-app-mode="attention"] #bodyResults,
      .wrap[data-app-mode="attention"] .genome-wall,
      .wrap[data-app-mode="attention"] .matrix,
      .wrap[data-app-mode="attention"] #rows,
      .wrap[data-app-mode="attention"] #foot {
        display: none;
      }
      .wrap[data-app-mode="browse"] .health {
        display: none;
      }
      .attention-empty {
        padding: 44px 20px;
        text-align: center;
      }
      .attention-empty strong {
        display: block;
        color: var(--ink);
        font: 650 13px/1.4 var(--mono);
      }
      .attention-empty small {
        display: block;
        margin-top: 8px;
        color: var(--ink-faint);
        font: 10.5px/1.5 var(--mono);
      }
      /* compact five-location genome strip for list rows */
      .list-track {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
        width: 74px;
        height: 10px;
      }
      .list-track .gene {
        height: 10px;
        transform: none;
        border-radius: 2px;
        background: var(--genome-empty);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .list-track .gene.present {
        background: var(--genome-fill);
        box-shadow: none;
      }
      .list-track .gene.mutated {
        background: var(--mutation);
        box-shadow: 0 0 6px var(--mutation-glow);
      }
      .list-track .gene.variant {
        background: var(--variant);
        box-shadow: 0 0 6px var(--variant-glow);
      }
      .list-track .gene::before,
      .list-track .gene::after {
        display: none;
      }
      @media (max-width: 900px) {
        .head {
          grid-template-columns: 1fr auto;
          gap: 12px;
        }
        .head .st {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .stat:nth-child(3) {
          border-right: 0;
        }
        .stat:nth-child(-n + 3) {
          border-bottom: 1px solid var(--line);
        }
        .controls {
          grid-template-columns: auto 1fr;
        }
        .controls input {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .controls .chips {
          grid-column: auto;
        }
        .workspace-shell {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .mode-rail {
          position: static;
          flex-direction: row;
          align-items: center;
          gap: 4px;
        }
        .mode-rail button {
          flex: 1;
          justify-content: center;
        }
      }
      @media (max-width: 640px) {
        .wrap {
          padding: 20px 14px 42px;
        }
        .head {
          display: flex;
          align-items: center;
          min-height: auto;
          gap: 7px;
          padding-bottom: 15px;
        }
        .head h1 {
          width: 100%;
          margin-bottom: 2px;
        }
        .head .st {
          width: 100%;
          order: 3;
        }
        .head button {
          padding: 0 8px;
          font-size: 8.5px;
        }
        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          margin-top: 18px;
        }
        .stat {
          padding: 11px 9px;
        }
        .stat .n {
          font-size: 18px;
        }
        .stat .l {
          font-size: 8px;
          letter-spacing: 0.05em;
        }
        .controls {
          display: flex;
          align-items: stretch;
          gap: 8px;
        }
        .view-toggle {
          width: 100%;
          overflow-x: auto;
        }
        .view-toggle button {
          flex: 1 0 auto;
        }
        .controls input {
          min-height: 38px;
        }
        .chips {
          width: 100%;
        }
        .genome-wall {
          overflow-x: auto;
        }
        .genome-row {
          grid-template-columns: minmax(126px, 1fr) 150px 39px;
          gap: 10px;
          min-width: 365px;
          padding: 12px;
        }
        .genome-track {
          width: 150px;
        }
        .genome-name small {
          display: none;
        }
        .gene::after {
          font-size: 6px;
        }
        .row {
          grid-template-columns: 1fr auto;
          gap: 8px;
        }
        .row .ds {
          grid-column: 1 / -1;
          white-space: normal;
        }
        .row .harnesses {
          grid-column: 1;
        }
        .row .list-track {
          grid-column: 1 / -1;
          justify-self: start;
        }
        .matrix {
          display: block;
          overflow-x: auto;
        }
        .matrix th,
        .matrix td {
          padding: 9px 8px;
        }
        .portability-agent strong {
          min-width: 70px;
        }
        .portability-issue {
          margin-left: 0;
        }
        #drawer .panel {
          width: 100%;
        }
        #drawer .ph {
          padding: 15px 14px;
        }
        #drawer .pbody {
          padding: 16px 14px 28px;
        }
        .copies .c {
          grid-template-columns: 70px 1fr auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" data-app-mode="fleet">
      <div class="head">
        <h1>Skill Manager</h1>
        <span class="st" id="gen">scanning...</span>
        <span class="sp"></span>
        <button id="refreshBtn">Re-scan</button>
        <button id="exportBtn">Export snapshot</button>
        <button id="upstreamBtn">Check upstreams</button>
        <button id="themeBtn">Theme</button>
      </div>
      <main class="workspace-shell">
        <nav class="mode-rail" aria-label="App mode">
          <button id="fleetModeBtn" type="button" aria-pressed="true">
            Fleet
          </button>
          <button id="browseModeBtn" type="button" aria-pressed="false">
            Browse
          </button>
          <button id="attentionModeBtn" type="button" aria-pressed="false">
            Attention
            <span class="attention-count" id="attentionCount" aria-live="polite">0</span>
          </button>
        </nav>
        <div class="workspace">
          <div class="stats" id="stats"></div>
      <section class="health" id="health" aria-labelledby="healthTitle">
        <div class="health-head">
          <h2 id="healthTitle">Mutation queue</h2>
          <span id="healthMeta"></span>
        </div>
        <div id="healthItems"></div>
      </section>
      <div class="controls">
        <div class="view-toggle" aria-label="Inventory view">
          <button id="genomeViewBtn" type="button" aria-pressed="true">
            Genome
          </button>
          <button id="matrixViewBtn" type="button" aria-pressed="false">
            Matrix
          </button>
          <button id="portabilityViewBtn" type="button" aria-pressed="false">
            Portability
          </button>
          <button id="listViewBtn" type="button" aria-pressed="false">
            List
          </button>
        </div>
        <input
          id="q"
          placeholder="search skills + skill text..."
          autocomplete="off"
        />
        <div class="chips" id="harnessChips"></div>
        <div class="chips" id="statusChips"></div>
      </div>
      <div id="bodyResults" class="body-results" hidden></div>
      <div class="genome-wall" id="genomeWall"></div>
      <table class="matrix" id="matrix" hidden>
        <caption>
          Location matrix · canonical copy comparison
        </caption>
        <thead>
          <tr>
            <th>Skill</th>
            <th>pi</th>
            <th>opencode</th>
            <th>claude</th>
            <th>shared</th>
            <th>repo</th>
            <th>status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <table class="matrix" id="portabilityMatrix" hidden>
        <caption>
          Portability matrix · evidence-backed runtime checks
        </caption>
        <thead>
          <tr>
            <th>Skill</th>
            <th>pi</th>
            <th>claude</th>
            <th>codex</th>
            <th>opencode</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="rows" id="rows" hidden></div>
      <footer id="foot"></footer>
        </div>
      </main>
    </div>
    <div id="drawer">
      <div class="panel">
        <div class="ph">
          <h2 id="dTitle"></h2>
          <span id="dProvenance" aria-label="Provenance"></span>
          <button class="x" id="drawerClose" aria-label="Close">&times;</button>
        </div>
        <div class="pbody" id="dBody"></div>
      </div>
    </div>
    <div id="toast"></div>
    <script>
      let DATA = null;
      let ACTIONS = [];
      let q = "";
      let harness = "all";
      let status = "all";
      let view = "genome";
      let appMode = "fleet";
      const modeView = { fleet: "genome", browse: "list" };
      let pulseNames = new Set();
      let upstreamResults = {}; // name -> { stale, error } from /api/upstream-batch
      let COMPAT = null;
      const COMPAT_AGENTS = ["pi", "claude", "codex", "opencode"];
      const REASON_TEXT = {
        "found-global": "Sees this skill via a global path",
        "found-project": "Sees this skill via a project path",
        "found-trusted-project": "Sees this skill via a trusted project path",
        "found-package": "Sees this skill via a package source",
        "found-explicit": "Sees this skill via an explicit source",
        "not-found": "Does NOT see this skill",
        "blocked-trust": "Blocked - project trust not granted",
        "blocked-disabled": "Blocked - disabled",
        "unknown-no-profile": "No versioned discovery profile for this runtime",
      };
      const HARNESSES = ["pi", "opencode", "claude", "shared", "repo"];

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function inventorySignatures(inventory) {
        const signatures = new Map();
        if (!inventory) return signatures;
        for (const [name, copies] of Object.entries(inventory.byName || {})) {
          signatures.set(
            name,
            copies
              .map((copy) => copy.location + ":" + copy.sha)
              .sort()
              .join("|"),
          );
        }
        return signatures;
      }

      async function load({ pulse = false } = {}) {
        const previous = inventorySignatures(DATA);
        const [inventoryResponse, actionsResponse, compatResponse] =
          await Promise.all([
            fetch("/api/inventory"),
            fetch("/api/actions"),
            fetch("/api/compat"),
          ]);
        DATA = await inventoryResponse.json();
        ACTIONS = (await actionsResponse.json()).actions || [];
        COMPAT = compatResponse.ok ? await compatResponse.json() : null;
        pulseNames = new Set();
        if (pulse) {
          const next = inventorySignatures(DATA);
          for (const [name, signature] of next) {
            if (previous.get(name) !== signature) pulseNames.add(name);
          }
        }
        document.getElementById("gen").textContent =
          "generated " +
          (DATA.generatedAt || "").replace("T", " ").slice(0, 19);
        renderHarnessChips();
        renderStatusChips();
        renderStats();
        renderHealthActions();
        render();
        if (pulseNames.size) requestAnimationFrame(pulseChangedGenomes);
      }

      function renderHarnessChips() {
        const wrap = document.getElementById("harnessChips");
        wrap.textContent = "";
        const mk = (label, value) => {
          const c = el("button", "chip" + (harness === value ? " on" : ""));
          c.textContent = label;
          c.dataset.h = value;
          c.addEventListener("click", () => {
            harness = value;
            renderHarnessChips();
            render();
          });
          wrap.appendChild(c);
        };
        mk("ALL", "all");
        for (const h of HARNESSES) mk(h, h);
      }

      function renderStatusChips() {
        const wrap = document.getElementById("statusChips");
        wrap.textContent = "";
        const opts = [
          ["ALL", "all"],
          ["OK", "unique"],
          ["MIRROR", "duplicate"],
          ["VARIANT", "variant"],
          ["DRIFT", "drift"],
        ];
        for (const [label, value] of opts) {
          const c = el(
            "button",
            "chip" + (status === value ? " on" : ""),
            label,
          );
          c.dataset.s = value;
          c.addEventListener("click", () => {
            status = value;
            renderStatusChips();
            render();
          });
          wrap.appendChild(c);
        }
      }

      function renderStats() {
        const s = DATA.stats || {};
        const wrap = document.getElementById("stats");
        wrap.textContent = "";
        const add = (n, l, cls) => {
          const d = el("div", "stat");
          const num = el("div", "n" + (cls ? " " + cls : ""), String(n));
          const lab = el("div", "l", l);
          d.appendChild(num);
          d.appendChild(lab);
          wrap.appendChild(d);
        };
        add(s.totalSkills ?? 0, "skills");
        add(s.totalCopies ?? 0, "copies");
        add(
          DATA.locations ? Object.keys(DATA.locations).length : 0,
          "locations",
        );
        add(s.unique ?? 0, "unique", "good");
        add(s.duplicate ?? 0, "duplicate", "warn");
        add(s.drift ?? 0, "drift", "bad");
      }

      function renderHealthActions() {
        const section = document.getElementById("health");
        const wrap = document.getElementById("healthItems");
        const meta = document.getElementById("healthMeta");
        const count = document.getElementById("attentionCount");
        wrap.textContent = "";
        meta.textContent = ACTIONS.length
          ? ACTIONS.length + (ACTIONS.length === 1 ? " item" : " items")
          : "all clear";
        count.textContent = String(ACTIONS.length);
        count.classList.toggle("has", ACTIONS.length > 0);
        if (appMode === "browse") {
          section.hidden = true;
          return;
        }
        if (!ACTIONS.length) {
          if (appMode === "attention") {
            section.hidden = false;
            const empty = el("div", "attention-empty");
            empty.appendChild(el("strong", "", "Nothing needs attention."));
            empty.appendChild(
              el(
                "small",
                "",
                "No drift or uncommitted repo copies are queued.",
              ),
            );
            wrap.appendChild(empty);
          } else {
            section.hidden = true;
          }
          return;
        }
        section.hidden = false;
        for (const action of ACTIONS) {
          const item = el("button", "health-item");
          const badge = el(
            "span",
            "badge " + (action.priority === "high" ? "b-bad" : "b-warn"),
            action.priority,
          );
          const copy = el("span");
          copy.appendChild(
            el("strong", "", action.skill + " - " + action.title),
          );
          copy.appendChild(el("small", "", action.detail));
          const open = el("span", "har on", "inspect");
          item.append(badge, copy, open);
          item.addEventListener("click", () => openSkill(action.skill));
          wrap.appendChild(item);
        }
      }

      function isVariant(copy) {
        // Variant metadata is optional in the current inventory contract. When
        // supplied by a future scanner, it gets a distinct amber state rather
        // than being misread as coral drift.
        return copy?.role === "variant" || copy?.variant === true;
      }

      function statusOf(name) {
        const copies = DATA.byName[name];
        if (!copies || copies.length === 0) return "unique";
        if (copies.some(isVariant)) return "variant";
        const shas = new Set(copies.map((c) => c.sha));
        return shas.size > 1
          ? "drift"
          : copies.length > 1
            ? "duplicate"
            : "unique";
      }

      function statusLabel(currentStatus) {
        if (currentStatus === "drift") return "DRIFT";
        if (currentStatus === "variant") return "VARIANT";
        if (currentStatus === "duplicate") return "MIRROR";
        return "OK";
      }

      function statusBadgeClass(currentStatus) {
        if (currentStatus === "drift") return "b-bad";
        if (currentStatus === "duplicate" || currentStatus === "variant")
          return "b-warn";
        return "b-good";
      }

      function visibleNames() {
        return Object.keys(DATA.byName)
          .filter((name) => {
            const copies = DATA.byName[name];
            if (status !== "all" && statusOf(name) !== status) return false;
            if (
              harness !== "all" &&
              !copies.some((c) => c.location === harness)
            )
              return false;
            const hay = (
              name +
              " " +
              (copies[0].description || "")
            ).toLowerCase();
            return !q || hay.includes(q);
          })
          .sort();
      }

      function syncViewUI() {
        document.getElementById("genomeWall").hidden = view !== "genome";
        document.getElementById("rows").hidden = view !== "list";
        document.getElementById("matrix").hidden = view !== "matrix";
        document.getElementById("portabilityMatrix").hidden =
          view !== "portability";
        document
          .getElementById("genomeViewBtn")
          .setAttribute("aria-pressed", String(view === "genome"));
        document
          .getElementById("matrixViewBtn")
          .setAttribute("aria-pressed", String(view === "matrix"));
        document
          .getElementById("portabilityViewBtn")
          .setAttribute("aria-pressed", String(view === "portability"));
        document
          .getElementById("listViewBtn")
          .setAttribute("aria-pressed", String(view === "list"));
      }

      function setView(nextView) {

      // Minimal LCS-based line diff - returns {mark, line}[] with + - space markers.
      function simpleDiff(a, b) {
        const m = a.length,
          n = b.length;
        const dp = Array.from({ length: m + 1 }, () =>
          new Array(n + 1).fill(0),
        );
        for (let i = m - 1; i >= 0; i--) {
          for (let j = n - 1; j >= 0; j--) {
            dp[i][j] =
              a[i] === b[j]
                ? dp[i + 1][j + 1] + 1
                : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        const out = [];
        let i = 0,
          j = 0;
        while (i < m && j < n) {
          if (a[i] === b[j]) {
            out.push({ mark: " ", line: a[i] });
            i++;
            j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            out.push({ mark: "-", line: a[i] });
            i++;
          } else {
            out.push({ mark: "+", line: b[j] });
            j++;
          }
        }
        while (i < m) {
          out.push({ mark: "-", line: a[i] });
          i++;
        }
        while (j < n) {
          out.push({ mark: "+", line: b[j] });
          j++;
        }
        return out.slice(0, 120); // cap very long diffs
      }

      async function openSkill(name) {
        const r = await fetch("/api/skill?name=" + encodeURIComponent(name));
        const d = await r.json();
        document.getElementById("dTitle").textContent = name;
        const provenance =
          d.copies.find((copy) => copy.location === "repo")?.provenance ||

        const body = document.getElementById("dBody");
        body.textContent = "";
        const meta1 = el(
          "div",
          "meta",
          d.copies.length +
            (d.copies.length > 1 ? " copies" : " copy") +
            " · status: " +
            statusOf(name),
        );
        const copiesWrap = el("div", "copies");
        for (const c of d.copies) {
          const row = el("div", "c");
          row.appendChild(el("span", "", c.location));
          row.appendChild(el("span", "", (c.mtimeISO || "").slice(0, 10)));
          row.appendChild(el("span", "sha", (c.sha || "").slice(0, 10)));
          copiesWrap.appendChild(row);
        }
        body.appendChild(meta1);
        body.appendChild(copiesWrap);
        const portability = compatibilityFor(name);
        if (portability) {
          const section = el("section", "portability");
          section.appendChild(
            el(
              "h3",
              "",
              "Portability · profile " + (COMPAT?.profileVersion || "unknown"),
            ),
          );
          for (const runtime of COMPAT_AGENTS) {
            const agent = portability[runtime];
            const row = el("div", "portability-agent");
            row.appendChild(el("strong", "", runtime));
            row.appendChild(
              el("span", "status " + agent.status, agent.status.toUpperCase()),
            );
            for (const issue of agent.issues || []) {
              const detail = el("div", "portability-issue");
              detail.appendChild(el("code", "", issue.field));
              detail.appendChild(
                document.createTextNode(" · " + issue.note + " "),
              );
              detail.appendChild(
                el(
                  "small",
                  "",
                  "[" + issue.severity + " · " + issue.evidence + "]",
                ),
              );
              if (issue.remediation)
                detail.appendChild(el("small", "", " " + issue.remediation));
              row.appendChild(detail);
            }
            if (agent.customFields?.length) {
              row.appendChild(
                el(
                  "div",
                  "portability-issue",
                  "Custom fields: " + agent.customFields.join(", "),
                ),
              );
            }
            section.appendChild(row);
          }
          body.appendChild(section);
        }
        // Explain: how (and whether) each runtime discovers this skill.
        // Reason codes are the contract; the prose below is UI-side per the
        // discovery design (negative cases are the killer feature).
        const explainSection = el("section", "portability explain");
        explainSection.appendChild(
          el("h3", "", "Explain · who sees this skill"),
        );
        body.appendChild(explainSection);
        const explainStatus = el("div", "portability-issue", "Loading...");
        explainSection.appendChild(explainStatus);
        fetch("/api/explain?name=" + encodeURIComponent(name))
          .then((r) => r.json())
          .then((report) => {
            explainSection.removeChild(explainStatus);
            for (const runtime of COMPAT_AGENTS) {
              const res = report.agents?.[runtime];
              if (!res) continue;
              const found = res.reasonCode?.startsWith("found");
              const row = el("div", "portability-agent");
              row.appendChild(el("strong", "", runtime));
              row.appendChild(
                el(
                  "span",
                  "status " + (found ? "ok" : "warn"),
                  found
                    ? "SEES"
                    : res.reasonCode === "not-found"
                      ? "NOT SEEN"
                      : "UNKNOWN",
                ),
              );
              const verdict = el("div", "portability-issue");
              const reasonText =
                REASON_TEXT[res.reasonCode] || res.reasonCode || "?";
              verdict.appendChild(document.createTextNode(reasonText + ". "));
              const winner = res.winner;
              if (winner) {
                verdict.appendChild(
                  el(
                    "code",
                    "",
                    winner.location + " copy · " + winner.integrity,
                  ),
                );
              }
              if (res.blockers?.length) {
                verdict.appendChild(
                  el("small", "", " " + res.blockers.join("; ")),
                );
              }
              const profile = res.profile;
              if (profile) {
                verdict.appendChild(
                  el(
                    "small",
                    "",
                    " [evidence: " +
                      profile.evidence +
                      " · " +
                      profile.runtimeVersion +
                      "]",
                  ),
                );
              }
              row.appendChild(verdict);
              explainSection.appendChild(row);
            }
          })
          .catch(() => {
            explainSection.removeChild(explainStatus);
            explainSection.appendChild(
              el("div", "portability-issue", "Explain unavailable."),
            );
          });
        const desc = d.copies[0].description;
        if (desc) body.appendChild(el("div", "meta", "What it does: " + desc));
        const tags = d.copies[0].tags;
        if (tags && tags.length)
          body.appendChild(el("div", "meta", "Tags: " + tags.join(", ")));
        body.appendChild(el("div", "meta", "SKILL.md"));
        const pre = el("pre", "skilltext", (d.fullText || "").slice(0, 3000));
        body.appendChild(pre);
        // drift diff: show what differs between two divergent copies
        if (statusOf(name) === "drift" && d.texts && d.texts.length >= 2) {
          const bySha = {};
          for (const c of d.texts) {
            const k =
              (d.copies.find((x) => x.location === c.location) || {}).sha || "";
            if (!bySha[k]) bySha[k] = c;
          }
          const distinct = Object.values(bySha);
          if (distinct.length >= 2) {
            const a = distinct[0].text.split(String.fromCharCode(10));
            const b = distinct[1].text.split(String.fromCharCode(10));
            const diffLines = simpleDiff(a, b);
            body.appendChild(
              el(
                "div",
                "meta",
                "Drift diff (" +
                  distinct[0].location +
                  " vs " +
                  distinct[1].location +
                  "):",
              ),
            );
            const pre = el("pre", "skilltext");
            pre.style.maxHeight = "260px";
            for (const dline of diffLines) {
              const span = document.createElement("div");
              span.textContent = dline.mark + " " + dline.line;
              if (dline.mark === "+") span.style.color = "var(--good)";
              else if (dline.mark === "-") span.style.color = "var(--bad)";
              else span.style.color = "var(--ink3)";
              pre.appendChild(span);
            }
            body.appendChild(pre);
          }
        }
        const repoCopy = d.copies.find((copy) => copy.location === "repo");
        if (statusOf(name) === "drift" && repoCopy) {
          const syncRow = el("div", "meta");
          const syncButton = el("button", "chip", "Preview sync from repo");
          syncButton.addEventListener("click", async () => {
            syncButton.disabled = true;
            syncButton.textContent = "Loading preview...";
            try {
              const response = await fetch(
                "/api/sync-preview?name=" + encodeURIComponent(name),
              );
              const preview = await response.json();
              if (!response.ok)
                throw new Error(preview.error || "Preview failed");
              renderSyncPreview(preview, body);
              syncButton.remove();
            } catch (error) {
              syncButton.disabled = false;
              syncButton.textContent = "Preview unavailable";
              showToast(
                error instanceof Error ? error.message : "Preview failed",
              );
            }
          });
          syncRow.appendChild(syncButton);
          body.appendChild(syncRow);
        }

        // upstream check
        const up = d.copies && d.copies[0] ? d.copies[0].upstream : null;
        if (up) {
          const row = el("div", "meta");
          const btn = el("button", "chip", "Check upstream");
          btn.addEventListener("click", async () => {
            btn.textContent = "Checking...";
            try {
              const r = await fetch(
                "/api/upstream?name=" + encodeURIComponent(name),
              );
              const u = await r.json();
              if (u.error) {
                btn.textContent = "Check failed: " + u.error;
                return;
              }
              btn.textContent = u.stale ? "Update available" : "Up to date";
              btn.style.borderColor = u.stale ? "var(--bad)" : "var(--good)";
              btn.style.color = u.stale ? "var(--bad)" : "var(--good)";
            } catch {
              btn.textContent = "Check failed";
            }
          });
          row.appendChild(btn);
          body.appendChild(row);
        }
        document.getElementById("drawer").classList.add("open");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2400);

      function renderSyncPreview(preview, body) {
        const panel = el("section", "sync-preview");
        panel.appendChild(el("h3", "", "Sync from repo"));
        panel.appendChild(
          el(
            "p",
            "",
            "The repo copy will replace only the selected SKILL.md files. Review each diff, then confirm.",
          ),
        );
        const selections = [];
        for (const target of preview.targets) {
          const label = el("label", "sync-target");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = true;
          checkbox.addEventListener("change", () => {
            const selection = { path: target.path, sha: target.sha };
            const index = selections.findIndex(
              (item) => item.path === target.path,
            );
            if (checkbox.checked && index === -1) selections.push(selection);
            if (!checkbox.checked && index !== -1) selections.splice(index, 1);
            confirm.disabled = selections.length === 0;
            confirm.textContent = "Sync " + selections.length + " selected";
          });
          label.appendChild(checkbox);
          const details = el("span");
          details.appendChild(el("strong", "", target.location));
          details.appendChild(el("small", "", "selected mirror copy"));
          label.appendChild(details);
          panel.appendChild(label);
          selections.push({ path: target.path, sha: target.sha });

          const diffLines = simpleDiff(
            target.text.split(String.fromCharCode(10)),
            preview.source.text.split(String.fromCharCode(10)),
          );
          const diff = el("pre", "skilltext");
          diff.style.maxHeight = "180px";
          for (const line of diffLines) {
            const diffLine = document.createElement("div");
            diffLine.textContent = line.mark + " " + line.line;
            if (line.mark === "+") diffLine.style.color = "var(--good)";
            else if (line.mark === "-") diffLine.style.color = "var(--bad)";
            else diffLine.style.color = "var(--ink3)";
            diff.appendChild(diffLine);
          }
          panel.appendChild(diff);
        }
        const actions = el("div", "sync-actions");
        const confirm = el(
          "button",
          "sync-confirm",
          "Sync " + selections.length + " selected",
        );
        confirm.addEventListener("click", async () => {
          const approval = window.confirm(
            "Replace SKILL.md in " +
              selections.length +
              " selected location(s) with the repo copy?",
          );
          if (!approval) return;
          confirm.disabled = true;
          confirm.textContent = "Syncing...";
          try {
            const response = await fetch("/api/sync", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: preview.name, targets: selections }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Sync failed");
            document.getElementById("drawer").classList.remove("open");
            await load();
            showToast(
              result.synced.length === 1
                ? "Synced 1 copy"
                : "Synced " + result.synced.length + " copies",
            );
          } catch (error) {
            confirm.disabled = false;
            confirm.textContent = "Sync " + selections.length + " selected";
            showToast(error instanceof Error ? error.message : "Sync failed");
          }
        });
        const cancel = el("button", "chip", "Cancel");
        cancel.addEventListener("click", () => panel.remove());
        actions.append(confirm, cancel);
        panel.appendChild(actions);
        panel.appendChild(
          el(
            "div",
            "sync-note",
            "No files are changed until you confirm. This never commits, pulls, or deletes files.",
          ),
        );
        body.appendChild(panel);
      }

      document.getElementById("q").addEventListener("input", (e) => {
        q = e.target.value.trim().toLowerCase();
        render();
        // debounced literal full-text search over SKILL.md bodies
        clearTimeout(searchTimer);
        const wrap = document.getElementById("bodyResults");
        wrap.hidden = true;
        if (!q) return;
        searchTimer = setTimeout(async () => {
          try {
            const r = await fetch("/api/search?q=" + encodeURIComponent(q));
            const d = await r.json();
            const list = (d.results || []).filter(
              (res) =>
                !visibleNames().includes(res.name) ||
                !res.name.toLowerCase().includes(q),
            );
            wrap.textContent = "";
            if (!list.length) {
              wrap.hidden = true;
              return;
            }
            const head = el("div", "br-head");
            head.appendChild(el("span", "", "In skill text"));
            head.appendChild(el("span", "", list.length + " matches"));
            wrap.appendChild(head);
            for (const res of list.slice(0, 25)) {
              const item = el("button", "br-item");
              const title = el("strong", "", res.name);
              // highlight the query inside the snippet
              const re = new RegExp("(" + escapeRegExp(q) + ")", "gi");
              const snip = el("small", "");
              const parts = res.snippet.split(re);
              for (const part of parts) {
                if (part.toLowerCase() === q)
                  snip.appendChild(el("em", "", part));
                else snip.appendChild(document.createTextNode(part));
              }
              item.appendChild(title);
              item.appendChild(snip);
              item.addEventListener("click", () => openSkill(res.name));
              wrap.appendChild(item);
            }
            wrap.hidden = false;
          } catch {
            wrap.hidden = true;
          }
        }, 350);
      });
      document
        .getElementById("upstreamBtn")
        .addEventListener("click", async () => {
          const button = document.getElementById("upstreamBtn");
          button.disabled = true;
          button.textContent = "Checking...";
          try {
            const r = await fetch("/api/upstream-batch");
            const d = await r.json();
            upstreamResults = d.results || {};
            const staleCount = Object.values(upstreamResults).filter(
              (u) => u.stale,
            ).length;
            button.textContent = staleCount
              ? staleCount + " stale"
              : "Up to date";
            render();
          } catch {
            button.textContent = "Check failed";
          } finally {
            setTimeout(() => {
              button.disabled = false;
            }, 500);
          }
        });
      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      document
        .getElementById("refreshBtn")
        .addEventListener("click", async () => {
          const t = document.getElementById("toast");
          t.textContent = "Re-scanning...";
          t.classList.add("show");
          await fetch("/api/refresh");
          await load();
          t.textContent = "Done";
          setTimeout(() => t.classList.remove("show"), 1200);
        });
      document
        .getElementById("exportBtn")
        .addEventListener("click", async () => {
          const button = document.getElementById("exportBtn");
          button.disabled = true;
          button.textContent = "Preparing...";
          try {
            const response = await fetch("/api/snapshot");
            if (!response.ok) throw new Error("Snapshot request failed");
            const blob = await response.blob();
            const link = document.createElement("a");
            const href = URL.createObjectURL(blob);
            link.href = href;
            link.download = "skill-manager-snapshot.html";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(href), 0);
          } finally {
            button.disabled = false;
            button.textContent = "Export snapshot";
          }
        });
      document.getElementById("themeBtn").addEventListener("click", () => {
        const h = document.documentElement;
        h.setAttribute(
          "data-theme",
          h.getAttribute("data-theme") === "dark" ? "light" : "dark",
        );
        try {
          localStorage.setItem("sm-theme", h.getAttribute("data-theme"));
        } catch {}
      });
      (function () {
        try {
          const s = localStorage.getItem("sm-theme");
          if (s) document.documentElement.setAttribute("data-theme", s);
        } catch {}
      })();
      // WATCH MODE SSE INSERTION POINT: attach EventSource here and call load() on inventory events.
      try {
        const events = new EventSource("/api/events");
        events.addEventListener("inventory", () => {
          document.getElementById("gen").textContent = "live - refreshing...";
          load({ pulse: true });
        });
      } catch {
        // SSE unsupported - manual refresh still works
      }
      load();
    </script>
  </body>
</html>
