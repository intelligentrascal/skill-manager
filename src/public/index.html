<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Manager</title>
<style>
:root{
  --bg:#0b0e12; --bg2:#10141a; --card:#141920; --card2:#1a212b;
  --ink:#e6edf3; --ink2:#9aa8b8; --ink3:#6b7a8c;
  --line:#232c38; --line2:#33404f;
  --good:#3ddc84; --warn:#e5b567; --bad:#e26d5a; --info:#6db3f2;
  --accent:#e8b44a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#fff; --card:#fff; --card2:#f0f2f5;
  --ink:#1a222c; --ink2:#47566a; --ink3:#7c8a9b;
  --line:#e0e4ea; --line2:#c8d0da;
  --good:#1f8f6b; --warn:#a17017; --bad:#c24534; --info:#2f6fb0;
  --accent:#a8760f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:36px 22px 80px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:18px;margin-bottom:24px}
.head h1{font-family:var(--mono);font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.head .st{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-family:var(--mono)}
.head .sp{flex:1}
.head button{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--card);border:2px solid var(--line2);color:var(--ink);padding:8px 14px;cursor:pointer;transition:.15s}
.head button:hover{border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:26px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:700}
.stat .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.stat .n.good{color:var(--good)}.stat .n.warn{color:var(--warn)}.stat .n.bad{color:var(--bad)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.controls input{flex:1;min-width:180px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:13px;color:var(--ink);outline:none}
.controls input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:2px solid var(--line2);border-radius:999px;padding:6px 12px;background:var(--card);color:var(--ink2);cursor:pointer;transition:.12s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:190px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--card)}
.row .nm{font-family:var(--mono);font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.harnesses{display:flex;gap:4px;flex-wrap:wrap}
.har{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line2);border-radius:4px;padding:2px 6px;color:var(--ink2)}
.har.on{color:var(--info);border-color:var(--info)}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-good{color:var(--good);border:1px solid var(--good)}.b-warn{color:var(--warn);border:1px solid var(--warn)}.b-bad{color:var(--bad);border:1px solid var(--bad)}
.empty{padding:50px;text-align:center;color:var(--ink3);font-family:var(--mono);font-size:13px}
#drawer{position:fixed;inset:0;background:rgba(6,8,10,.6);display:none;z-index:100;backdrop-filter:blur(3px)}
#drawer.open{display:block}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,94vw);background:var(--bg2);border-left:1px solid var(--line2);display:flex;flex-direction:column}
#drawer .ph{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
#drawer .ph h2{font-family:var(--mono);font-size:17px}
#drawer .ph .x{margin-left:auto;background:none;border:none;color:var(--ink3);font-size:22px;cursor:pointer}
#drawer .pbody{flex:1;overflow-y:auto;padding:20px 22px}
.copies{margin:14px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.copies .c{display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink2);align-items:center}
.copies .c:last-child{border-bottom:none}
.copies .c .sha{color:var(--ink3);font-size:10px}
pre.skilltext{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--ink2);max-height:400px;overflow-y:auto}
.meta{font-size:12px;color:var(--ink2);margin:8px 0}
.meta b{color:var(--ink)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;padding:9px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.show{opacity:1}
footer{margin-top:30px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.05em}
@media(max-width:640px){.row{grid-template-columns:1fr}.row .ds{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Skill Manager</h1>
    <span class="st" id="gen">scanning...</span>
    <span class="sp"></span>
    <button id="refreshBtn">Re-scan</button>
    <button id="themeBtn">Theme</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="q" placeholder="search skills..." autocomplete="off">
    <div class="chips" id="harnessChips"></div>
    <div class="chips" id="statusChips"></div>
  </div>
  <div class="rows" id="rows"></div>
  <footer id="foot"></footer>
</div>
<div id="drawer">
  <div class="panel">
    <div class="ph"><h2 id="dTitle"></h2><button class="x" id="drawerClose" aria-label="Close">&times;</button></div>
    <div class="pbody" id="dBody"></div>
  </div>
</div>
<div id="toast"></div>
<script>
let DATA = null;
let q = "";
let harness = "all";
let status = "all";
const HARNESSES = ["pi", "opencode", "claude", "shared", "repo"];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function load() {
  const r = await fetch("/api/inventory");
  DATA = await r.json();
  document.getElementById("gen").textContent =
    "generated " + (DATA.generatedAt || "").replace("T", " ").slice(0, 19);
  renderHarnessChips();
  renderStatusChips();
  renderStats();
  render();
}

function renderHarnessChips() {
  const wrap = document.getElementById("harnessChips");
  wrap.textContent = "";
  const mk = (label, value) => {
    const c = el("button", "chip" + (harness === value ? " on" : ""));
    c.textContent = label;
    c.dataset.h = value;
    c.addEventListener("click", () => { harness = value; renderHarnessChips(); render(); });
    wrap.appendChild(c);
  };
  mk("ALL", "all");
  for (const h of HARNESSES) mk(h, h);
}

function renderStatusChips() {
  const wrap = document.getElementById("statusChips");
  wrap.textContent = "";
  const opts = [["ALL", "all"], ["OK", "unique"], ["DUP", "duplicate"], ["DRIFT", "drift"]];
  for (const [label, value] of opts) {
    const c = el("button", "chip" + (status === value ? " on" : ""), label);
    c.dataset.s = value;
    c.addEventListener("click", () => { status = value; renderStatusChips(); render(); });
    wrap.appendChild(c);
  }
}

function renderStats() {
  const s = DATA.stats || {};
  const wrap = document.getElementById("stats");
  wrap.textContent = "";
  const add = (n, l, cls) => {
    const d = el("div", "stat");
    const num = el("div", "n" + (cls ? " " + cls : ""), String(n));
    const lab = el("div", "l", l);
    d.appendChild(num); d.appendChild(lab); wrap.appendChild(d);
  };
  add(s.totalSkills ?? 0, "skills");
  add(s.totalCopies ?? 0, "copies");
  add((DATA.locations ? Object.keys(DATA.locations).length : 0), "locations");
  add(s.unique ?? 0, "unique", "good");
  add(s.duplicate ?? 0, "duplicate", "warn");
  add(s.drift ?? 0, "drift", "bad");
}

function statusOf(name) {
  const copies = DATA.byName[name];
  if (!copies || copies.length === 0) return "unique";
  const shas = new Set(copies.map((c) => c.sha));
  return shas.size > 1 ? "drift" : copies.length > 1 ? "duplicate" : "unique";
}

function render() {
  const rows = document.getElementById("rows");
  rows.textContent = "";
  if (!DATA) return;
  const names = Object.keys(DATA.byName).filter((name) => {
    const copies = DATA.byName[name];
    if (status !== "all" && statusOf(name) !== status) return false;
    if (harness !== "all" && !copies.some((c) => c.location === harness)) return false;
    const hay = (name + " " + (copies[0].description || "")).toLowerCase();
    return !q || hay.includes(q);
  }).sort();
  if (names.length === 0) {
    rows.appendChild(el("div", "empty", "NO SKILLS MATCH"));
    return;
  }
  for (const name of names) {
    const copies = DATA.byName[name];
    const st = statusOf(name);
    const row = el("div", "row");
    row.dataset.name = name;
    const nm = el("div", "nm", name);
    const ds = el("div", "ds", (copies[0].description || "").slice(0, 110));
    const hw = el("div", "harnesses");
    for (const h of HARNESSES) {
      if (copies.some((c) => c.location === h)) hw.appendChild(el("span", "har on", h));
    }
    const badgeCls = st === "drift" ? "b-bad" : st === "duplicate" ? "b-warn" : "b-good";
    const badgeLabel = st === "drift" ? "DRIFT" : st === "duplicate" ? "DUP" : "OK";
    const badge = el("span", "badge " + badgeCls, badgeLabel);
    row.append(nm, ds, hw, badge);
    row.addEventListener("click", () => openSkill(name));
    rows.appendChild(row);
  }
  document.getElementById("foot").textContent =
    names.length + " skills shown · click a row for details";
}

async function openSkill(name) {
  const r = await fetch("/api/skill?name=" + encodeURIComponent(name));
  const d = await r.json();
  document.getElementById("dTitle").textContent = name;
  const body = document.getElementById("dBody");
  body.textContent = "";
  const meta1 = el("div", "meta", d.copies.length + " copy" + (d.copies.length > 1 ? "ies" : "") + " · status: " + statusOf(name));
  const copiesWrap = el("div", "copies");
  for (const c of d.copies) {
    const row = el("div", "c");
    row.appendChild(el("span", "", c.location));
    row.appendChild(el("span", "", (c.mtimeISO || "").slice(0, 10)));
    row.appendChild(el("span", "sha", (c.sha || "").slice(0, 10)));
    copiesWrap.appendChild(row);
  }
  body.appendChild(meta1);
  body.appendChild(copiesWrap);
  const desc = d.copies[0].description;
  if (desc) body.appendChild(el("div", "meta", "What it does: " + desc));
  const tags = d.copies[0].tags;
  if (tags && tags.length) body.appendChild(el("div", "meta", "Tags: " + tags.join(", ")));
  body.appendChild(el("div", "meta", "SKILL.md"));
  const pre = el("pre", "skilltext", (d.fullText || "").slice(0, 3000));
  body.appendChild(pre);
  document.getElementById("drawer").classList.add("open");
}

document.getElementById("drawer").addEventListener("click", (ev) => {
  if (ev.target.id === "drawer") document.getElementById("drawer").classList.remove("open");
});
document.getElementById("drawerClose").addEventListener("click", () => {
  document.getElementById("drawer").classList.remove("open");
});
document.getElementById("q").addEventListener("input", (e) => {
  q = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("refreshBtn").addEventListener("click", async () => {
  const t = document.getElementById("toast");
  t.textContent = "Re-scanning...";
  t.classList.add("show");
  await fetch("/api/refresh");
  await load();
  t.textContent = "Done";
  setTimeout(() => t.classList.remove("show"), 1200);
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const h = document.documentElement;
  h.setAttribute("data-theme", h.getAttribute("data-theme") === "dark" ? "light" : "dark");
  try { localStorage.setItem("sm-theme", h.getAttribute("data-theme")); } catch {}
});
(function () {
  try {
    const s = localStorage.getItem("sm-theme");
    if (s) document.documentElement.setAttribute("data-theme", s);
  } catch {}
})();
load();
</script>
</body>
</html>
