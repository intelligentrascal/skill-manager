<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Manager</title>
    <style>
      :root {
        --bg: #0b0e12;
        --bg2: #10141a;
        --card: #141920;
        --card2: #1a212b;
        --ink: #e6edf3;
        --ink2: #9aa8b8;
        --ink3: #6b7a8c;
        --line: #232c38;
        --line2: #33404f;
        --good: #3ddc84;
        --warn: #e5b567;
        --bad: #e26d5a;
        --info: #6db3f2;
        --accent: #e8b44a;
        --genome-fill: #b9c7d5;
        --genome-empty: #1a222c;
        --mutation: #e47a67;
        --mutation-glow: rgba(228, 122, 103, 0.28);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      [data-theme="light"] {
        --bg: #f4f5f7;
        --bg2: #fff;
        --card: #fff;
        --card2: #f0f2f5;
        --ink: #1a222c;
        --ink2: #47566a;
        --ink3: #7c8a9b;
        --line: #e0e4ea;
        --line2: #c8d0da;
        --good: #1f8f6b;
        --warn: #a17017;
        --bad: #c24534;
        --info: #2f6fb0;
        --accent: #a8760f;
        --genome-fill: #536579;
        --genome-empty: #e9edf2;
        --mutation: #ca5d4d;
        --mutation-glow: rgba(202, 93, 77, 0.2);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 22px 80px;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        border-bottom: 3px solid var(--ink);
        padding-bottom: 18px;
        margin-bottom: 24px;
      }
      .head h1 {
        font-family: var(--mono);
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .head .st {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink3);
        font-family: var(--mono);
      }
      .head .sp {
        flex: 1;
      }
      .head button {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: var(--card);
        border: 2px solid var(--line2);
        color: var(--ink);
        padding: 8px 14px;
        cursor: pointer;
        transition: 0.15s;
      }
      .head button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 26px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        background: var(--card);
      }
      .stat .n {
        font-family: var(--mono);
        font-size: 26px;
        font-weight: 700;
      }
      .stat .l {
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink3);
        margin-top: 4px;
      }
      .stat .n.good {
        color: var(--good);
      }
      .stat .n.warn {
        color: var(--warn);
      }
      .stat .n.bad {
        color: var(--bad);
      }
      .health {
        margin: 0 0 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .health-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .health-head h2 {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .health-head span {
        color: var(--ink3);
        font-family: var(--mono);
        font-size: 10px;
      }
      .health-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: var(--bg2);
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .health-item:last-child {
        border-bottom: 0;
      }
      .health-item:hover,
      .health-item:focus-visible {
        background: var(--card);
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .health-item strong {
        font-family: var(--mono);
        font-size: 12px;
      }
      .health-item small {
        color: var(--ink2);
        font-size: 12px;
      }
      .health-empty {
        padding: 14px 16px;
        color: var(--good);
        font-family: var(--mono);
        font-size: 12px;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 18px;
      }
      .controls input {
        flex: 1;
        min-width: 180px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }
      .controls input:focus {
        border-color: var(--accent);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border: 2px solid var(--line2);
        border-radius: 999px;
        padding: 6px 12px;
        background: var(--card);
        color: var(--ink2);
        cursor: pointer;
        transition: 0.12s;
      }
      .chip.on {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .view-toggle {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
      }
      .view-toggle button {
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--ink3);
        cursor: pointer;
        font: 700 10px var(--mono);
        letter-spacing: 0.08em;
        padding: 6px 9px;
        text-transform: uppercase;
      }
      .view-toggle button[aria-pressed="true"] {
        background: var(--card2);
        color: var(--ink);
      }
      .genome-wall {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .genome-row {
        display: grid;
        grid-template-columns: minmax(170px, 1.3fr) minmax(160px, 1fr) 62px;
        align-items: center;
        gap: 26px;
        min-height: 62px;
        padding: 11px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--bg2);
        cursor: pointer;
        transition: background 140ms ease;
      }
      .genome-row:last-child {
        border-bottom: 0;
      }
      .genome-row:hover,
      .genome-row:focus-visible {
        background: var(--card);
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .genome-name {
        min-width: 0;
      }
      .genome-name strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font: 700 13px/1.35 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .genome-name small {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--ink3);
        font-size: 10.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .genome-track {
        position: relative;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
        width: min(100%, 164px);
        height: 15px;
        padding: 2px 0;
      }
      .gene {
        position: relative;
        min-width: 0;
        border-radius: 2px;
        background: var(--genome-empty);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .gene.present {
        background: var(--genome-fill);
        box-shadow: none;
      }
      .gene.mutated {
        transform: translateY(2px);
        background: linear-gradient(
          112deg,
          var(--mutation) 0 43%,
          var(--bg) 44% 50%,
          var(--mutation) 51% 100%
        );
        box-shadow:
          0 0 0 1px var(--mutation),
          0 0 13px var(--mutation-glow);
      }
      .gene::after {
        position: absolute;
        top: 21px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--ink3);
        content: attr(data-location);
        font: 7px/1 var(--mono);
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .genome-signal {
        justify-self: end;
        color: var(--ink3);
        font: 800 9px var(--mono);
        letter-spacing: 0.07em;
      }
      .genome-signal.drift {
        color: var(--mutation);
      }
      .genome-signal.duplicate {
        color: var(--warn);
      }
      .genome-up {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-left: 6px;
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--ink3);
        font: 700 8.5px var(--mono);
        letter-spacing: 0.05em;
        vertical-align: 2px;
      }
      .genome-up.ok {
        border-color: color-mix(in srgb, var(--good) 40%, transparent);
        color: var(--good);
      }
      .genome-up.stale {
        border-color: var(--mutation);
        color: var(--mutation);
        box-shadow: 0 0 8px color-mix(in srgb, var(--mutation) 45%, transparent);
      }
      .genome-up.unknown {
        opacity: 0.55;
      }
      .genome-up:hover {
        filter: brightness(1.25);
      }
      .matrix {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        border-collapse: collapse;
        background: var(--bg2);
        font: 12px/1.45 var(--mono);
      }
      .matrix th {
        padding: 9px 10px;
        color: var(--ink3);
        font-size: 9px;
        letter-spacing: 0.09em;
        text-align: left;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .matrix td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .matrix tbody tr:last-child td {
        border-bottom: 0;
      }
      .matrix tbody tr {
        cursor: pointer;
        transition: background 140ms ease;
      }
      .matrix tbody tr:hover {
        background: var(--card);
      }
      .matrix .m-name {
        overflow: hidden;
        color: var(--ink);
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .matrix .m-name small {
        display: block;
        overflow: hidden;
        color: var(--ink3);
        font-size: 10px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .matrix .m-cell {
        color: var(--ink3);
        font-size: 12px;
        text-align: center;
      }
      .matrix .m-cell.present {
        color: var(--genome-fill);
      }
      .matrix .m-cell.mutated {
        color: var(--mutation);
        text-shadow: 0 0 9px var(--mutation-glow);
      }
      .matrix .m-signal {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }
      .matrix .m-signal.drift {
        color: var(--mutation);
      }
      .matrix .m-signal.duplicate {
        color: var(--warn);
      }
      .portability-cell {
        min-width: 66px;
        cursor: help;
        font: 800 10px var(--mono);
        letter-spacing: 0.06em;
        text-align: center;
      }
      .portability-cell.ok {
        color: var(--good);
      }
      .portability-cell.warn {
        color: var(--warn);
      }
      .portability-cell.incompatible {
        color: var(--mutation);
      }
      .portability {
        margin: 18px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .portability h3 {
        padding: 10px 12px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        font: 700 11px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .portability-agent {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .portability-agent:last-child {
        border-bottom: 0;
      }
      .portability-agent strong {
        display: inline-block;
        min-width: 80px;
        font: 700 11px var(--mono);
        text-transform: uppercase;
      }
      .portability-agent .status {
        font: 800 10px var(--mono);
        letter-spacing: 0.06em;
      }
      .portability-agent .status.ok {
        color: var(--good);
      }
      .portability-agent .status.warn {
        color: var(--warn);
      }
      .portability-agent .status.incompatible {
        color: var(--mutation);
      }
      .portability-issue {
        margin: 7px 0 0 80px;
        color: var(--ink2);
        font-size: 11px;
      }
      .portability-issue code {
        color: var(--ink);
        font: 10px var(--mono);
      }
      .portability-issue small {
        color: var(--ink3);
      }
      .body-results {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--bg2);
      }
      .body-results .br-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--ink3);
        background: var(--card);
        font: 800 10px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .body-results .br-item {
        display: block;
        width: 100%;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: background 140ms ease;
      }
      .body-results .br-item:last-child {
        border-bottom: 0;
      }
      .body-results .br-item:hover {
        background: var(--card);
      }
      .body-results .br-item strong {
        font: 700 12px var(--mono);
      }
      .body-results .br-item em {
        color: var(--accent);
        font-style: normal;
      }
      .body-results .br-item small {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--ink3);
        font: 10.5px/1.5 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .genome-track.pulse::before {
        position: absolute;
        z-index: -1;
        inset: -12px -14px;
        border: 2px solid var(--mutation);
        border-radius: 8px;
        box-shadow: 0 0 16px var(--mutation-glow);
        content: "";
        animation: genome-ripple 950ms ease-out both;
        pointer-events: none;
      }
      @keyframes genome-ripple {
        0% {
          opacity: 0;
          transform: scaleX(0.84);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scaleX(1.12);
        }
      }
      .rows {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 190px 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        transition: background 0.1s;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row:hover {
        background: var(--card);
      }
      .row .nm {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .ds {
        font-size: 12.5px;
        color: var(--ink2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .harnesses {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .har {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border: 1px solid var(--line2);
        border-radius: 4px;
        padding: 2px 6px;
        color: var(--ink2);
      }
      .har.on {
        color: var(--info);
        border-color: var(--info);
      }
      .badge {
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .b-good {
        color: var(--good);
        border: 1px solid var(--good);
      }
      .b-warn {
        color: var(--warn);
        border: 1px solid var(--warn);
      }
      .b-bad {
        color: var(--bad);
        border: 1px solid var(--bad);
      }
      .empty {
        padding: 50px;
        text-align: center;
        color: var(--ink3);
        font-family: var(--mono);
        font-size: 13px;
      }
      #drawer {
        position: fixed;
        inset: 0;
        background: rgba(6, 8, 10, 0.6);
        display: none;
        z-index: 100;
        backdrop-filter: blur(3px);
      }
      #drawer.open {
        display: block;
      }
      #drawer .panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(640px, 94vw);
        background: var(--bg2);
        border-left: 1px solid var(--line2);
        display: flex;
        flex-direction: column;
      }
      #drawer .ph {
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      #drawer .ph h2 {
        font-family: var(--mono);
        font-size: 17px;
      }
      #drawer .ph .x {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--ink3);
        font-size: 22px;
        cursor: pointer;
      }
      #drawer .pbody {
        flex: 1;
        overflow-y: auto;
        padding: 20px 22px;
      }
      .copies {
        margin: 14px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .copies .c {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink2);
        align-items: center;
      }
      .copies .c:last-child {
        border-bottom: none;
      }
      .copies .c .sha {
        color: var(--ink3);
        font-size: 10px;
      }
      pre.skilltext {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        color: var(--ink2);
        max-height: 400px;
        overflow-y: auto;
      }
      .meta {
        font-size: 12px;
        color: var(--ink2);
        margin: 8px 0;
      }
      .meta b {
        color: var(--ink);
      }
      .sync-preview {
        margin-top: 18px;
        border: 1px solid var(--warn);
        border-radius: 8px;
        padding: 14px;
      }
      .sync-preview h3 {
        font-family: var(--mono);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .sync-preview p {
        color: var(--ink2);
        font-size: 12px;
        margin-bottom: 12px;
      }
      .sync-target {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        color: var(--ink2);
        cursor: pointer;
      }
      .sync-target input {
        margin-top: 3px;
        accent-color: var(--accent);
      }
      .sync-target strong {
        display: block;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 11px;
      }
      .sync-target small {
        display: block;
        font-size: 11px;
      }
      .sync-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .sync-actions button {
        cursor: pointer;
      }
      .sync-confirm {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #17120a;
        padding: 7px 10px;
        font: 700 10px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .sync-confirm:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .sync-note {
        color: var(--ink3);
        font-size: 10px;
        margin-top: 10px;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        font-family: var(--mono);
        font-size: 11px;
        padding: 9px 18px;
        border-radius: 6px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 200;
      }
      #toast.show {
        opacity: 1;
      }
      footer {
        margin-top: 30px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink3);
        letter-spacing: 0.05em;
      }
      @media (max-width: 640px) {
        .genome-row {
          grid-template-columns: minmax(0, 1fr) 164px 44px;
          gap: 12px;
          padding: 12px;
        }
        .genome-name small {
          display: none;
        }
        .row {
          grid-template-columns: 1fr;
        }
        .row .ds {
          white-space: normal;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .genome-track.pulse::before {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <h1>Skill Manager</h1>
        <span class="st" id="gen">scanning...</span>
        <span class="sp"></span>
        <button id="refreshBtn">Re-scan</button>
        <button id="exportBtn">Export snapshot</button>
        <button id="upstreamBtn">Check upstreams</button>
        <button id="themeBtn">Theme</button>
      </div>
      <div class="stats" id="stats"></div>
      <section class="health" aria-labelledby="healthTitle">
        <div class="health-head">
          <h2 id="healthTitle">Mutation queue</h2>
          <span id="healthMeta"></span>
        </div>
        <div id="healthItems"></div>
      </section>
      <div class="controls">
        <div class="view-toggle" aria-label="Inventory view">
          <button id="genomeViewBtn" type="button" aria-pressed="true">
            Genome
          </button>
          <button id="matrixViewBtn" type="button" aria-pressed="false">
            Matrix
          </button>
          <button id="portabilityViewBtn" type="button" aria-pressed="false">
            Portability
          </button>
          <button id="listViewBtn" type="button" aria-pressed="false">
            List
          </button>
        </div>
        <input
          id="q"
          placeholder="search skills + skill text..."
          autocomplete="off"
        />
        <div class="chips" id="harnessChips"></div>
        <div class="chips" id="statusChips"></div>
      </div>
      <div id="bodyResults" class="body-results" hidden></div>
      <div class="genome-wall" id="genomeWall"></div>
      <table class="matrix" id="matrix" hidden>
        <thead>
          <tr>
            <th>Skill</th>
            <th>pi</th>
            <th>opencode</th>
            <th>claude</th>
            <th>shared</th>
            <th>repo</th>
            <th>status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <table class="matrix" id="portabilityMatrix" hidden>
        <thead>
          <tr>
            <th>Skill</th>
            <th>pi</th>
            <th>claude</th>
            <th>codex</th>
            <th>opencode</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="rows" id="rows" hidden></div>
      <footer id="foot"></footer>
    </div>
    <div id="drawer">
      <div class="panel">
        <div class="ph">
          <h2 id="dTitle"></h2>
          <button class="x" id="drawerClose" aria-label="Close">&times;</button>
        </div>
        <div class="pbody" id="dBody"></div>
      </div>
    </div>
    <div id="toast"></div>
    <script>
      let DATA = null;
      let ACTIONS = [];
      let q = "";
      let harness = "all";
      let status = "all";
      let view = "genome";
      let pulseNames = new Set();
      let upstreamResults = {}; // name -> { stale, error } from /api/upstream-batch
      let COMPAT = null;
      const COMPAT_AGENTS = ["pi", "claude", "codex", "opencode"];
      const HARNESSES = ["pi", "opencode", "claude", "shared", "repo"];

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function inventorySignatures(inventory) {
        const signatures = new Map();
        if (!inventory) return signatures;
        for (const [name, copies] of Object.entries(inventory.byName || {})) {
          signatures.set(
            name,
            copies
              .map((copy) => copy.location + ":" + copy.sha)
              .sort()
              .join("|"),
          );
        }
        return signatures;
      }

      async function load({ pulse = false } = {}) {
        const previous = inventorySignatures(DATA);
        const [inventoryResponse, actionsResponse, compatResponse] =
          await Promise.all([
            fetch("/api/inventory"),
            fetch("/api/actions"),
            fetch("/api/compat"),
          ]);
        DATA = await inventoryResponse.json();
        ACTIONS = (await actionsResponse.json()).actions || [];
        COMPAT = compatResponse.ok ? await compatResponse.json() : null;
        pulseNames = new Set();
        if (pulse) {
          const next = inventorySignatures(DATA);
          for (const [name, signature] of next) {
            if (previous.get(name) !== signature) pulseNames.add(name);
          }
        }
        document.getElementById("gen").textContent =
          "generated " +
          (DATA.generatedAt || "").replace("T", " ").slice(0, 19);
        renderHarnessChips();
        renderStatusChips();
        renderStats();
        renderHealthActions();
        render();
        if (pulseNames.size) requestAnimationFrame(pulseChangedGenomes);
      }

      function renderHarnessChips() {
        const wrap = document.getElementById("harnessChips");
        wrap.textContent = "";
        const mk = (label, value) => {
          const c = el("button", "chip" + (harness === value ? " on" : ""));
          c.textContent = label;
          c.dataset.h = value;
          c.addEventListener("click", () => {
            harness = value;
            renderHarnessChips();
            render();
          });
          wrap.appendChild(c);
        };
        mk("ALL", "all");
        for (const h of HARNESSES) mk(h, h);
      }

      function renderStatusChips() {
        const wrap = document.getElementById("statusChips");
        wrap.textContent = "";
        const opts = [
          ["ALL", "all"],
          ["OK", "unique"],
          ["DUP", "duplicate"],
          ["DRIFT", "drift"],
        ];
        for (const [label, value] of opts) {
          const c = el(
            "button",
            "chip" + (status === value ? " on" : ""),
            label,
          );
          c.dataset.s = value;
          c.addEventListener("click", () => {
            status = value;
            renderStatusChips();
            render();
          });
          wrap.appendChild(c);
        }
      }

      function renderStats() {
        const s = DATA.stats || {};
        const wrap = document.getElementById("stats");
        wrap.textContent = "";
        const add = (n, l, cls) => {
          const d = el("div", "stat");
          const num = el("div", "n" + (cls ? " " + cls : ""), String(n));
          const lab = el("div", "l", l);
          d.appendChild(num);
          d.appendChild(lab);
          wrap.appendChild(d);
        };
        add(s.totalSkills ?? 0, "skills");
        add(s.totalCopies ?? 0, "copies");
        add(
          DATA.locations ? Object.keys(DATA.locations).length : 0,
          "locations",
        );
        add(s.unique ?? 0, "unique", "good");
        add(s.duplicate ?? 0, "duplicate", "warn");
        add(s.drift ?? 0, "drift", "bad");
      }

      function renderHealthActions() {
        const wrap = document.getElementById("healthItems");
        const meta = document.getElementById("healthMeta");
        wrap.textContent = "";
        meta.textContent = ACTIONS.length
          ? ACTIONS.length + (ACTIONS.length === 1 ? " item" : " items")
          : "all clear";
        if (!ACTIONS.length) {
          wrap.appendChild(
            el(
              "div",
              "health-empty",
              "No drift or uncommitted repo skills detected.",
            ),
          );
          return;
        }
        for (const action of ACTIONS) {
          const item = el("button", "health-item");
          const badge = el(
            "span",
            "badge " + (action.priority === "high" ? "b-bad" : "b-warn"),
            action.priority,
          );
          const copy = el("span");
          copy.appendChild(
            el("strong", "", action.skill + " - " + action.title),
          );
          copy.appendChild(el("small", "", action.detail));
          const open = el("span", "har on", "inspect");
          item.append(badge, copy, open);
          item.addEventListener("click", () => openSkill(action.skill));
          wrap.appendChild(item);
        }
      }

      function statusOf(name) {
        const copies = DATA.byName[name];
        if (!copies || copies.length === 0) return "unique";
        const shas = new Set(copies.map((c) => c.sha));
        return shas.size > 1
          ? "drift"
          : copies.length > 1
            ? "duplicate"
            : "unique";
      }

      function visibleNames() {
        return Object.keys(DATA.byName)
          .filter((name) => {
            const copies = DATA.byName[name];
            if (status !== "all" && statusOf(name) !== status) return false;
            if (
              harness !== "all" &&
              !copies.some((c) => c.location === harness)
            )
              return false;
            const hay = (
              name +
              " " +
              (copies[0].description || "")
            ).toLowerCase();
            return !q || hay.includes(q);
          })
          .sort();
      }

      function setView(nextView) {
        view = nextView;
        document.getElementById("genomeWall").hidden = view !== "genome";
        document.getElementById("rows").hidden = view !== "list";
        document.getElementById("matrix").hidden = view !== "matrix";
        document.getElementById("portabilityMatrix").hidden =
          view !== "portability";
        document
          .getElementById("genomeViewBtn")
          .setAttribute("aria-pressed", String(view === "genome"));
        document
          .getElementById("matrixViewBtn")
          .setAttribute("aria-pressed", String(view === "matrix"));
        document
          .getElementById("portabilityViewBtn")
          .setAttribute("aria-pressed", String(view === "portability"));
        document
          .getElementById("listViewBtn")
          .setAttribute("aria-pressed", String(view === "list"));
        render();
      }

      function renderMatrix() {
        const tbody = document.getElementById("matrix").querySelector("tbody");
        tbody.textContent = "";
        for (const name of visibleNames()) {
          const copies = DATA.byName[name];
          const source =
            copies.find((copy) => copy.location === "repo") || copies[0];
          const st = statusOf(name);
          const tr = document.createElement("tr");
          const nameTd = document.createElement("td");
          const nameCell = el("div", "m-name", name);
          nameCell.appendChild(
            el(
              "small",
              "",
              (copies[0].description || "uncategorized").slice(0, 60),
            ),
          );
          nameTd.appendChild(nameCell);
          tr.appendChild(nameTd);
          for (const location of HARNESSES) {
            const copy = copies.find((item) => item.location === location);
            const cell = el("td", "m-cell");
            if (copy) {
              cell.classList.add(
                copy.sha === source.sha ? "present" : "mutated",
              );
              cell.textContent = copy.sha === source.sha ? "\u25cf" : "\u25d0";
            } else {
              cell.textContent = "\u00b7";
            }
            tr.appendChild(cell);
          }
          const signal = el(
            "td",
            "m-signal " + st,
            st === "drift" ? "DRIFT" : st === "duplicate" ? "DUP" : "OK",
          );
          tr.appendChild(signal);
          tr.addEventListener("click", () => openSkill(name));
          tbody.appendChild(tr);
        }
      }

      function compatibilityFor(name) {
        return (
          COMPAT?.skills?.find((skill) => skill.name === name)?.agents || null
        );
      }

      function issueSummary(agent) {
        if (!agent?.issues?.length) return "No compatibility issues.";
        return agent.issues.map((issue) => issue.note).join(" ");
      }

      function renderPortabilityMatrix() {
        const tbody = document
          .getElementById("portabilityMatrix")
          .querySelector("tbody");
        tbody.textContent = "";
        for (const name of visibleNames()) {
          const copies = DATA.byName[name];
          const agents = compatibilityFor(name);
          const tr = document.createElement("tr");
          const nameTd = document.createElement("td");
          const nameCell = el("div", "m-name", name);
          nameCell.appendChild(
            el(
              "small",
              "",
              (copies[0].description || "uncategorized").slice(0, 60),
            ),
          );
          nameTd.appendChild(nameCell);
          tr.appendChild(nameTd);
          for (const runtime of COMPAT_AGENTS) {
            const agent = agents?.[runtime];
            const cell = el(
              "td",
              "portability-cell " + (agent?.status || "warn"),
              agent?.status === "incompatible"
                ? "BLOCK"
                : agent?.status === "warn"
                  ? "WARN"
                  : "OK",
            );
            cell.title = issueSummary(agent);
            tr.appendChild(cell);
          }
          tr.addEventListener("click", () => openSkill(name));
          tbody.appendChild(tr);
        }
      }

      function renderGenomeRow(name, copies) {
        const source =
          copies.find((copy) => copy.location === "repo") || copies[0];
        const st = statusOf(name);
        const row = el("button", "genome-row");
        row.type = "button";
        row.dataset.name = name;
        const label = el("span", "genome-name");
        label.appendChild(el("strong", "", name));
        label.appendChild(
          el(
            "small",
            "",
            (copies[0].description || "uncategorized").slice(0, 72),
          ),
        );
        // upstream chip: ↗ marker when the skill declares an upstream source;
        // turns STALE (coral) / OK after the fleet check runs
        const up = copies[0].upstream;
        if (up) {
          const u = upstreamResults[name];
          const chip = el(
            "span",
            "genome-up" +
              (u ? (u.stale ? " stale" : u.error ? " unknown" : " ok") : ""),
            u ? (u.stale ? "STALE" : u.error ? "?" : "OK") : "\u2197",
          );
          chip.title = "upstream: " + up;
          label.querySelector("strong").appendChild(chip);
        }
        const track = el("span", "genome-track");
        for (const location of HARNESSES) {
          const copy = copies.find((item) => item.location === location);
          const gene = el("span", "gene" + (copy ? " present" : ""));
          gene.dataset.location = location;
          if (copy && copy.sha !== source.sha) gene.classList.add("mutated");
          track.appendChild(gene);
        }
        const signal = el(
          "span",
          "genome-signal " + st,
          st === "drift" ? "DRIFT" : st === "duplicate" ? "DUP" : "OK",
        );
        row.append(label, track, signal);
        row.addEventListener("click", () => openSkill(name));
        return row;
      }

      function render() {
        if (!DATA) return;
        const rows = document.getElementById("rows");
        const wall = document.getElementById("genomeWall");
        const names = visibleNames();
        rows.textContent = "";
        wall.textContent = "";
        if (view === "matrix") {
          renderMatrix();
          document.getElementById("foot").textContent =
            names.length + " skills";
          return;
        }
        if (view === "portability") {
          renderPortabilityMatrix();
          document.getElementById("foot").textContent =
            names.length +
            " skills · compatibility profile " +
            (COMPAT?.profileVersion || "unavailable");
          return;
        }
        if (!names.length) {
          const empty = el("div", "empty", "NO SKILLS MATCH");
          (view === "genome" ? wall : rows).appendChild(empty);
          document.getElementById("foot").textContent = "0 skills shown";
          return;
        }
        for (const name of names) {
          const copies = DATA.byName[name];
          wall.appendChild(renderGenomeRow(name, copies));
          const st = statusOf(name);
          const row = el("div", "row");
          row.dataset.name = name;
          const nm = el("div", "nm", name);
          const ds = el(
            "div",
            "ds",
            (copies[0].description || "").slice(0, 110),
          );
          const hw = el("div", "harnesses");
          for (const h of HARNESSES) {
            if (copies.some((c) => c.location === h))
              hw.appendChild(el("span", "har on", h));
          }
          const badgeCls =
            st === "drift" ? "b-bad" : st === "duplicate" ? "b-warn" : "b-good";
          const badge = el(
            "span",
            "badge " + badgeCls,
            st === "drift" ? "DRIFT" : st === "duplicate" ? "DUP" : "OK",
          );
          row.append(nm, ds, hw, badge);
          row.addEventListener("click", () => openSkill(name));
          rows.appendChild(row);
        }
        document.getElementById("foot").textContent =
          names.length + " skills shown · click a genome for details";
      }

      function pulseChangedGenomes() {
        for (const name of pulseNames) {
          const row = Array.from(document.querySelectorAll(".genome-row")).find(
            (element) => element.dataset.name === name,
          );
          const track = row && row.querySelector(".genome-track");
          if (!track) continue;
          track.classList.remove("pulse");
          void track.offsetWidth;
          track.classList.add("pulse");
          track.addEventListener(
            "animationend",
            () => track.classList.remove("pulse"),
            { once: true },
          );
        }
      }

      // Minimal LCS-based line diff - returns {mark, line}[] with + - space markers.
      function simpleDiff(a, b) {
        const m = a.length,
          n = b.length;
        const dp = Array.from({ length: m + 1 }, () =>
          new Array(n + 1).fill(0),
        );
        for (let i = m - 1; i >= 0; i--) {
          for (let j = n - 1; j >= 0; j--) {
            dp[i][j] =
              a[i] === b[j]
                ? dp[i + 1][j + 1] + 1
                : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        const out = [];
        let i = 0,
          j = 0;
        while (i < m && j < n) {
          if (a[i] === b[j]) {
            out.push({ mark: " ", line: a[i] });
            i++;
            j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            out.push({ mark: "-", line: a[i] });
            i++;
          } else {
            out.push({ mark: "+", line: b[j] });
            j++;
          }
        }
        while (i < m) {
          out.push({ mark: "-", line: a[i] });
          i++;
        }
        while (j < n) {
          out.push({ mark: "+", line: b[j] });
          j++;
        }
        return out.slice(0, 120); // cap very long diffs
      }

      async function openSkill(name) {
        const r = await fetch("/api/skill?name=" + encodeURIComponent(name));
        const d = await r.json();
        document.getElementById("dTitle").textContent = name;
        const body = document.getElementById("dBody");
        body.textContent = "";
        const meta1 = el(
          "div",
          "meta",
          d.copies.length +
            (d.copies.length > 1 ? " copies" : " copy") +
            " · status: " +
            statusOf(name),
        );
        const copiesWrap = el("div", "copies");
        for (const c of d.copies) {
          const row = el("div", "c");
          row.appendChild(el("span", "", c.location));
          row.appendChild(el("span", "", (c.mtimeISO || "").slice(0, 10)));
          row.appendChild(el("span", "sha", (c.sha || "").slice(0, 10)));
          copiesWrap.appendChild(row);
        }
        body.appendChild(meta1);
        body.appendChild(copiesWrap);
        const portability = compatibilityFor(name);
        if (portability) {
          const section = el("section", "portability");
          section.appendChild(
            el(
              "h3",
              "",
              "Portability · profile " + (COMPAT?.profileVersion || "unknown"),
            ),
          );
          for (const runtime of COMPAT_AGENTS) {
            const agent = portability[runtime];
            const row = el("div", "portability-agent");
            row.appendChild(el("strong", "", runtime));
            row.appendChild(
              el("span", "status " + agent.status, agent.status.toUpperCase()),
            );
            for (const issue of agent.issues || []) {
              const detail = el("div", "portability-issue");
              detail.appendChild(el("code", "", issue.field));
              detail.appendChild(
                document.createTextNode(" · " + issue.note + " "),
              );
              detail.appendChild(
                el(
                  "small",
                  "",
                  "[" + issue.severity + " · " + issue.evidence + "]",
                ),
              );
              if (issue.remediation)
                detail.appendChild(el("small", "", " " + issue.remediation));
              row.appendChild(detail);
            }
            if (agent.customFields?.length) {
              row.appendChild(
                el(
                  "div",
                  "portability-issue",
                  "Custom fields: " + agent.customFields.join(", "),
                ),
              );
            }
            section.appendChild(row);
          }
          body.appendChild(section);
        }
        const desc = d.copies[0].description;
        if (desc) body.appendChild(el("div", "meta", "What it does: " + desc));
        const tags = d.copies[0].tags;
        if (tags && tags.length)
          body.appendChild(el("div", "meta", "Tags: " + tags.join(", ")));
        body.appendChild(el("div", "meta", "SKILL.md"));
        const pre = el("pre", "skilltext", (d.fullText || "").slice(0, 3000));
        body.appendChild(pre);
        // drift diff: show what differs between two divergent copies
        if (statusOf(name) === "drift" && d.texts && d.texts.length >= 2) {
          const bySha = {};
          for (const c of d.texts) {
            const k =
              (d.copies.find((x) => x.location === c.location) || {}).sha || "";
            if (!bySha[k]) bySha[k] = c;
          }
          const distinct = Object.values(bySha);
          if (distinct.length >= 2) {
            const a = distinct[0].text.split(String.fromCharCode(10));
            const b = distinct[1].text.split(String.fromCharCode(10));
            const diffLines = simpleDiff(a, b);
            body.appendChild(
              el(
                "div",
                "meta",
                "Drift diff (" +
                  distinct[0].location +
                  " vs " +
                  distinct[1].location +
                  "):",
              ),
            );
            const pre = el("pre", "skilltext");
            pre.style.maxHeight = "260px";
            for (const dline of diffLines) {
              const span = document.createElement("div");
              span.textContent = dline.mark + " " + dline.line;
              if (dline.mark === "+") span.style.color = "var(--good)";
              else if (dline.mark === "-") span.style.color = "var(--bad)";
              else span.style.color = "var(--ink3)";
              pre.appendChild(span);
            }
            body.appendChild(pre);
          }
        }
        const repoCopy = d.copies.find((copy) => copy.location === "repo");
        if (statusOf(name) === "drift" && repoCopy) {
          const syncRow = el("div", "meta");
          const syncButton = el("button", "chip", "Preview sync from repo");
          syncButton.addEventListener("click", async () => {
            syncButton.disabled = true;
            syncButton.textContent = "Loading preview...";
            try {
              const response = await fetch(
                "/api/sync-preview?name=" + encodeURIComponent(name),
              );
              const preview = await response.json();
              if (!response.ok)
                throw new Error(preview.error || "Preview failed");
              renderSyncPreview(preview, body);
              syncButton.remove();
            } catch (error) {
              syncButton.disabled = false;
              syncButton.textContent = "Preview unavailable";
              showToast(
                error instanceof Error ? error.message : "Preview failed",
              );
            }
          });
          syncRow.appendChild(syncButton);
          body.appendChild(syncRow);
        }

        // upstream check
        const up = d.copies && d.copies[0] ? d.copies[0].upstream : null;
        if (up) {
          const row = el("div", "meta");
          const btn = el("button", "chip", "Check upstream: " + up);
          btn.addEventListener("click", async () => {
            btn.textContent = "Checking...";
            try {
              const r = await fetch(
                "/api/upstream?name=" + encodeURIComponent(name),
              );
              const u = await r.json();
              if (u.error) {
                btn.textContent = "Upstream: " + up + " (" + u.error + ")";
                return;
              }
              btn.textContent = u.stale
                ? "STALE - newer version upstream: " + up
                : "Up to date: " + up;
              btn.style.borderColor = u.stale ? "var(--bad)" : "var(--good)";
              btn.style.color = u.stale ? "var(--bad)" : "var(--good)";
            } catch {
              btn.textContent = "Upstream check failed: " + up;
            }
          });
          row.appendChild(btn);
          body.appendChild(row);
        }
        document.getElementById("drawer").classList.add("open");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2400);
      }

      function renderSyncPreview(preview, body) {
        const panel = el("section", "sync-preview");
        panel.appendChild(el("h3", "", "Sync from repo"));
        panel.appendChild(
          el(
            "p",
            "",
            "The repo copy will replace only the selected SKILL.md files. Review each diff, then confirm.",
          ),
        );
        const selections = [];
        for (const target of preview.targets) {
          const label = el("label", "sync-target");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = true;
          checkbox.addEventListener("change", () => {
            const selection = { path: target.path, sha: target.sha };
            const index = selections.findIndex(
              (item) => item.path === target.path,
            );
            if (checkbox.checked && index === -1) selections.push(selection);
            if (!checkbox.checked && index !== -1) selections.splice(index, 1);
            confirm.disabled = selections.length === 0;
            confirm.textContent = "Sync " + selections.length + " selected";
          });
          label.appendChild(checkbox);
          const details = el("span");
          details.appendChild(el("strong", "", target.location));
          details.appendChild(el("small", "", target.path));
          label.appendChild(details);
          panel.appendChild(label);
          selections.push({ path: target.path, sha: target.sha });

          const diffLines = simpleDiff(
            target.text.split(String.fromCharCode(10)),
            preview.source.text.split(String.fromCharCode(10)),
          );
          const diff = el("pre", "skilltext");
          diff.style.maxHeight = "180px";
          for (const line of diffLines) {
            const diffLine = document.createElement("div");
            diffLine.textContent = line.mark + " " + line.line;
            if (line.mark === "+") diffLine.style.color = "var(--good)";
            else if (line.mark === "-") diffLine.style.color = "var(--bad)";
            else diffLine.style.color = "var(--ink3)";
            diff.appendChild(diffLine);
          }
          panel.appendChild(diff);
        }
        const actions = el("div", "sync-actions");
        const confirm = el(
          "button",
          "sync-confirm",
          "Sync " + selections.length + " selected",
        );
        confirm.addEventListener("click", async () => {
          const approval = window.confirm(
            "Replace SKILL.md in " +
              selections.length +
              " selected location(s) with the repo copy?",
          );
          if (!approval) return;
          confirm.disabled = true;
          confirm.textContent = "Syncing...";
          try {
            const response = await fetch("/api/sync", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: preview.name, targets: selections }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Sync failed");
            document.getElementById("drawer").classList.remove("open");
            await load();
            showToast(
              result.synced.length === 1
                ? "Synced 1 copy"
                : "Synced " + result.synced.length + " copies",
            );
          } catch (error) {
            confirm.disabled = false;
            confirm.textContent = "Sync " + selections.length + " selected";
            showToast(error instanceof Error ? error.message : "Sync failed");
          }
        });
        const cancel = el("button", "chip", "Cancel");
        cancel.addEventListener("click", () => panel.remove());
        actions.append(confirm, cancel);
        panel.appendChild(actions);
        panel.appendChild(
          el(
            "div",
            "sync-note",
            "No files are changed until you confirm. This never commits, pulls, or deletes files.",
          ),
        );
        body.appendChild(panel);
      }

      document.getElementById("drawer").addEventListener("click", (ev) => {
        if (ev.target.id === "drawer")
          document.getElementById("drawer").classList.remove("open");
      });
      document.getElementById("drawerClose").addEventListener("click", () => {
        document.getElementById("drawer").classList.remove("open");
      });
      document
        .getElementById("genomeViewBtn")
        .addEventListener("click", () => setView("genome"));
      document
        .getElementById("listViewBtn")
        .addEventListener("click", () => setView("list"));
      document
        .getElementById("matrixViewBtn")
        .addEventListener("click", () => setView("matrix"));
      document
        .getElementById("portabilityViewBtn")
        .addEventListener("click", () => setView("portability"));
      let searchTimer = null;
      document.getElementById("q").addEventListener("input", (e) => {
        q = e.target.value.trim().toLowerCase();
        render();
        // debounced literal full-text search over SKILL.md bodies
        clearTimeout(searchTimer);
        const wrap = document.getElementById("bodyResults");
        wrap.hidden = true;
        if (!q) return;
        searchTimer = setTimeout(async () => {
          try {
            const r = await fetch("/api/search?q=" + encodeURIComponent(q));
            const d = await r.json();
            const list = (d.results || []).filter(
              (res) =>
                !visibleNames().includes(res.name) ||
                !res.name.toLowerCase().includes(q),
            );
            wrap.textContent = "";
            if (!list.length) {
              wrap.hidden = true;
              return;
            }
            const head = el("div", "br-head");
            head.appendChild(el("span", "", "In skill text"));
            head.appendChild(el("span", "", list.length + " matches"));
            wrap.appendChild(head);
            for (const res of list.slice(0, 25)) {
              const item = el("button", "br-item");
              const title = el("strong", "", res.name);
              // highlight the query inside the snippet
              const re = new RegExp("(" + escapeRegExp(q) + ")", "gi");
              const snip = el("small", "");
              const parts = res.snippet.split(re);
              for (const part of parts) {
                if (part.toLowerCase() === q)
                  snip.appendChild(el("em", "", part));
                else snip.appendChild(document.createTextNode(part));
              }
              item.appendChild(title);
              item.appendChild(snip);
              item.addEventListener("click", () => openSkill(res.name));
              wrap.appendChild(item);
            }
            wrap.hidden = false;
          } catch {
            wrap.hidden = true;
          }
        }, 350);
      });
      document
        .getElementById("upstreamBtn")
        .addEventListener("click", async () => {
          const button = document.getElementById("upstreamBtn");
          button.disabled = true;
          button.textContent = "Checking...";
          try {
            const r = await fetch("/api/upstream-batch");
            const d = await r.json();
            upstreamResults = d.results || {};
            const staleCount = Object.values(upstreamResults).filter(
              (u) => u.stale,
            ).length;
            button.textContent = staleCount
              ? staleCount + " stale"
              : "Up to date";
            render();
          } catch {
            button.textContent = "Check failed";
          } finally {
            setTimeout(() => {
              button.disabled = false;
            }, 500);
          }
        });
      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      document
        .getElementById("refreshBtn")
        .addEventListener("click", async () => {
          const t = document.getElementById("toast");
          t.textContent = "Re-scanning...";
          t.classList.add("show");
          await fetch("/api/refresh");
          await load();
          t.textContent = "Done";
          setTimeout(() => t.classList.remove("show"), 1200);
        });
      document
        .getElementById("exportBtn")
        .addEventListener("click", async () => {
          const button = document.getElementById("exportBtn");
          button.disabled = true;
          button.textContent = "Preparing...";
          try {
            const response = await fetch("/api/snapshot");
            if (!response.ok) throw new Error("Snapshot request failed");
            const blob = await response.blob();
            const link = document.createElement("a");
            const href = URL.createObjectURL(blob);
            link.href = href;
            link.download = "skill-manager-snapshot.html";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(href), 0);
          } finally {
            button.disabled = false;
            button.textContent = "Export snapshot";
          }
        });
      document.getElementById("themeBtn").addEventListener("click", () => {
        const h = document.documentElement;
        h.setAttribute(
          "data-theme",
          h.getAttribute("data-theme") === "dark" ? "light" : "dark",
        );
        try {
          localStorage.setItem("sm-theme", h.getAttribute("data-theme"));
        } catch {}
      });
      (function () {
        try {
          const s = localStorage.getItem("sm-theme");
          if (s) document.documentElement.setAttribute("data-theme", s);
        } catch {}
      })();
      // WATCH MODE SSE INSERTION POINT: attach EventSource here and call load() on inventory events.
      try {
        const events = new EventSource("/api/events");
        events.addEventListener("inventory", () => {
          document.getElementById("gen").textContent = "live - refreshing...";
          load({ pulse: true });
        });
      } catch {
        // SSE unsupported - manual refresh still works
      }
      load();
    </script>
  </body>
</html>
